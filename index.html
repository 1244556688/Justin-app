<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Album Music Player</title>

<script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.bg{
    position:fixed;
    inset:0;
    background-size:cover;
    background-position:center;
    filter:blur(35px) brightness(0.35);
    transform:scale(1.2);
    transition:0.5s;
}

.player{
    position:relative;
    width:360px;
    padding:25px;
    border-radius:28px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
    z-index:2;
}

.cover{
    width:100%;
    aspect-ratio:1/1;
    border-radius:24px;
    overflow:hidden;
    margin-bottom:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.45);
}

.cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.info{
    text-align:center;
    margin-bottom:20px;
}

.info h1{
    font-size:24px;
    margin-bottom:6px;
}

.info p{
    color:rgba(255,255,255,0.7);
}

.progress-container{
    width:100%;
    margin-bottom:18px;
}

.progress-bar{
    width:100%;
    height:6px;
    border-radius:999px;
    background:rgba(255,255,255,0.15);
    overflow:hidden;
    cursor:pointer;
}

.progress{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#00d2ff,#3a7bd5);
}

.time{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:12px;
    color:rgba(255,255,255,0.75);
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
}

button{
    border:none;
    cursor:pointer;
    color:white;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    transition:0.25s;
}

button:hover{
    transform:scale(1.08);
}

.small{
    width:54px;
    height:54px;
    font-size:20px;
}

.play{
    width:70px;
    height:70px;
    font-size:28px;
    background:linear-gradient(135deg,#00d2ff,#3a7bd5);
}

.upload{
    width:100%;
}

.upload input{
    width:100%;
    padding:10px;
    border-radius:14px;
    border:none;
    background:rgba(255,255,255,0.08);
    color:white;
}

.visualizer{
    margin-top:20px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:5px;
    height:35px;
}

.bar{
    width:5px;
    background:white;
    border-radius:999px;
    animation:wave 1s infinite ease-in-out;
}

.bar:nth-child(1){height:10px;animation-delay:0s;}
.bar:nth-child(2){height:18px;animation-delay:0.2s;}
.bar:nth-child(3){height:28px;animation-delay:0.4s;}
.bar:nth-child(4){height:20px;animation-delay:0.6s;}
.bar:nth-child(5){height:12px;animation-delay:0.8s;}

@keyframes wave{
    0%,100%{
        transform:scaleY(0.4);
        opacity:0.5;
    }
    50%{
        transform:scaleY(1.2);
        opacity:1;
    }
}
</style>
</head>
<body>

<div class="bg" id="bg"></div>

<div class="player">

    <div class="cover">
        <img id="cover"
        src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1200&auto=format&fit=crop">
    </div>

    <div class="info">
        <h1 id="title">選擇音樂</h1>
        <p id="artist">Unknown Artist</p>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar">
            <div class="progress" id="progress"></div>
        </div>

        <div class="time">
            <span id="current">0:00</span>
            <span id="duration">0:00</span>
        </div>
    </div>

    <div class="controls">
        <button class="small">⏮</button>
        <button class="play" id="playBtn">▶</button>
        <button class="small">⏭</button>
    </div>

    <div class="upload">
        <input type="file" id="musicInput" accept="audio/*">
    </div>

    <div class="visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

</div>

<audio id="audio"></audio>

<script>
const audio = document.getElementById("audio");
const musicInput = document.getElementById("musicInput");
const playBtn = document.getElementById("playBtn");

const title = document.getElementById("title");
const artist = document.getElementById("artist");

const cover = document.getElementById("cover");
const bg = document.getElementById("bg");

const progress = document.getElementById("progress");
const progressBar = document.getElementById("progressBar");

const current = document.getElementById("current");
const duration = document.getElementById("duration");

let playing = false;

bg.style.backgroundImage = `url(${cover.src})`;

musicInput.addEventListener("change",(e)=>{

    const file = e.target.files[0];

    if(!file) return;

    const url = URL.createObjectURL(file);

    audio.src = url;

    jsmediatags.read(file,{
        onSuccess: function(tag){

            const tags = tag.tags;

            title.textContent =
                tags.title || file.name;

            artist.textContent =
                tags.artist || "Unknown Artist";

            if(tags.picture){

                const picture = tags.picture;

                let base64String = "";

                for(let i=0;i<picture.data.length;i++){
                    base64String += String.fromCharCode(picture.data[i]);
                }

                const imageUrl =
                    `data:${picture.format};base64,${btoa(base64String)}`;

                cover.src = imageUrl;
                bg.style.backgroundImage = `url(${imageUrl})`;
            }
        },

        onError: function(error){
            console.log(error);
        }
    });

    audio.addEventListener("loadedmetadata",()=>{
        duration.textContent =
            formatTime(audio.duration);
    });
});

playBtn.addEventListener("click",()=>{

    if(!audio.src) return;

    if(playing){
        audio.pause();
        playBtn.textContent = "▶";
    }else{
        audio.play();
        playBtn.textContent = "⏸";
    }

    playing = !playing;
});

audio.addEventListener("timeupdate",()=>{

    if(audio.duration){

        const percent =
            (audio.currentTime / audio.duration) * 100;

        progress.style.width = percent + "%";

        current.textContent =
            formatTime(audio.currentTime);
    }
});

progressBar.addEventListener("click",(e)=>{

    const width = progressBar.clientWidth;

    const clickX = e.offsetX;

    audio.currentTime =
        (clickX / width) * audio.duration;
});

audio.addEventListener("ended",()=>{
    playBtn.textContent = "▶";
    playing = false;
});

function formatTime(time){

    const min = Math.floor(time / 60);

    const sec = Math.floor(time % 60)
        .toString()
        .padStart(2,"0");

    return `${min}:${sec}`;
}
</script>

</body>
</html>
